appId: br.com.rkxp.orch
productName: Orch
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
# O SDK executa o binário nativo do Claude Code: ele não pode ficar dentro do asar.
asarUnpack:
  - node_modules/@anthropic-ai/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Orch-Setup-${version}.${ext}
  # Rodar o instalador por cima de uma instalação existente atualiza o app no mesmo lugar
  # (o NSIS reaproveita a pasta anterior e fecha o app em execução). Projetos, configurações e
  # execuções gravadas ficam fora da pasta de instalação e não são tocados.
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: Orch
  language: '1046'
